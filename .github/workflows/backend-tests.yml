
name: Backend Tests

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-for-isolated-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Verify test files exist
        run: |
          test -n "$(find tests/unit -maxdepth 1 -name '*.test.js' -print -quit)"
          test -n "$(find tests/integration -maxdepth 1 -name '*.test.js' -print -quit)"

      - name: Install dependencies
        run: npm ci

      - name: Run complete backend regression
        run: npm run test:all
